name: CI

on:
  push:
    branches: ["main"]
  # Every pull request, not only those targeting main: a stacked pull request that skips
  # CI can be merged into its parent branch and reach main untested.
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ghostscript \
            ocrmypdf \
            qpdf \
            tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app tests worker migrations

      - name: Check migrations
        run: python -m alembic upgrade head --sql > /tmp/agentp-schema.sql

      - name: Test
        run: python -m pytest
