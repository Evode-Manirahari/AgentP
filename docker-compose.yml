services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      AGENTPDF_API_KEY: local-dev-key
      AGENTPDF_DATABASE_URL: postgresql+psycopg://agentpdf:local-password@postgres:5432/agentpdf
      AGENTPDF_REDIS_URL: redis://redis:6379/0
      AGENTPDF_S3_ENDPOINT_URL: http://minio:9000
      AGENTPDF_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AGENTPDF_S3_ACCESS_KEY_ID: agentpdf
      AGENTPDF_S3_SECRET_ACCESS_KEY: agentpdf-secret
      AGENTPDF_S3_BUCKET: agentpdf
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 pdf-jobs
    environment:
      AGENTPDF_API_KEY: local-dev-key
      AGENTPDF_DATABASE_URL: postgresql+psycopg://agentpdf:local-password@postgres:5432/agentpdf
      AGENTPDF_REDIS_URL: redis://redis:6379/0
      AGENTPDF_S3_ENDPOINT_URL: http://minio:9000
      AGENTPDF_S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      AGENTPDF_S3_ACCESS_KEY_ID: agentpdf
      AGENTPDF_S3_SECRET_ACCESS_KEY: agentpdf-secret
      AGENTPDF_S3_BUCKET: agentpdf
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentpdf
      POSTGRES_USER: agentpdf
      POSTGRES_PASSWORD: local-password
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpdf -d agentpdf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: agentpdf
      MINIO_ROOT_PASSWORD: agentpdf-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  minio-data:
