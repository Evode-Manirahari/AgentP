[project]
name = "agentp"
version = "0.1.0"
description = "Typed, asynchronous, verifiable PDF execution API for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "mcp>=2,<3",
    "ocrmypdf>=16,<18",
    "pikepdf>=9,<11",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.9,<1",
    "redis>=5,<7",
    "rq>=2,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=24,<26",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

